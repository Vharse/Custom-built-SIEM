error_log /dev/stderr warn;

log_format compact_siem '[$time_iso8601] ⚡ PROXY | $remote_addr | $request_method $uri | STATUS: $status';

server {
    listen 8080;
    server_name localhost;
    server_tokens off;

    access_log /dev/stdout compact_siem;

    client_max_body_size 1M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /frontend/ {
        alias /usr/share/nginx/html/frontend/;
        index login.html;
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /live-logs {
        if ($request_method !~ ^(GET|OPTIONS)$ ) {
            return 405;
        }
        proxy_pass http://backend:8000/live-logs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location /api/ {
        limit_except POST GET OPTIONS PUT DELETE {
            deny all;
        }
        proxy_pass http://backend:8000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}