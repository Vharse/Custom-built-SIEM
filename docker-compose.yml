services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      # - ./frontend:/siem-tool/backend/frontend
      - ./backend/logs:/siem-tool/backend/logs:rw
      - ./backend/db_data:/siem-tool/backend/db_data:rw
      - /var/run/fail2ban/fail2ban.sock:/var/run/fail2ban/fail2ban.sock:rw
    environment:
      - PYTHONPATH=/siem-tool:/siem-tool/backend
      - DATABASE_URL=sqlite:////siem-tool/backend/db_data/siem-tool.db
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SECRET_KEY=${JWT_SECRET}
      - PYTHONUNBUFFERED=1 
      # - APP_ENV=production
      - APP_ENV=${APP_ENV}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
      - /run
    restart: unless-stopped
    networks:
      - vault_network

  proxy:
    image: nginxinc/nginx-unprivileged:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/usr/share/nginx/html/frontend:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;", "-e", "/dev/stderr"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
      - /var/log/nginx:uid=101,gid=101,mode=0755
    networks:
      - vault_network
    restart: unless-stopped

networks:
  vault_network:
    driver: bridge